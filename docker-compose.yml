# Portainer (Git repository): set variables from .env.docker.example in the stack
# "Environment variables" section. Compose path: docker-compose.yml
#
# Local: docker compose --env-file .env.docker up -d --build
#
# The app service joins the external nginx_proxy network (Nginx Proxy Manager) on
# every deploy. Create it once on the host if missing: docker network create nginx_proxy

x-app-image: &app-image
  image: ${COMPOSE_PROJECT_NAME:-bolao26}-app
  build:
    context: .
    dockerfile: Dockerfile

x-laravel-environment: &laravel-environment
  APP_NAME: ${APP_NAME:-Bolao26}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in stack environment variables}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_STACK: ${LOG_STACK:-single}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: ${DB_CONNECTION:-mariadb}
  DB_HOST: mariadb
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-bolao26}
  DB_USERNAME: ${DB_USERNAME:-bolao26}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in stack environment variables}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-null}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Bolao26}
  VITE_APP_NAME: ${VITE_APP_NAME:-Bolao26}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  WEBPUSH_DB_TABLE: ${WEBPUSH_DB_TABLE:-push_subscriptions}
  WEBPUSH_DB_CONNECTION: ${WEBPUSH_DB_CONNECTION:-${DB_CONNECTION:-mariadb}}
  FIFA_API_BASE_URL: ${FIFA_API_BASE_URL:-https://api.fifa.com/api/v3}
  FIFA_SEASON_ID: ${FIFA_SEASON_ID:-285023}
  FIFA_API_LANGUAGE: ${FIFA_API_LANGUAGE:-en}
  FIFA_API_MATCH_COUNT: ${FIFA_API_MATCH_COUNT:-500}
  FIFA_API_TIMEOUT: ${FIFA_API_TIMEOUT:-15}
  FIFA_API_CONNECT_TIMEOUT: ${FIFA_API_CONNECT_TIMEOUT:-5}
  FIFA_SYNC_INTERVAL_HOURS: ${FIFA_SYNC_INTERVAL_HOURS:-6}
  FIFA_RESULTS_SYNC_MINUTES: ${FIFA_RESULTS_SYNC_MINUTES:-15}
  REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:?Set REGISTRATION_INVITE_CODE in stack environment variables}

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bolao26}
      MARIADB_USER: ${MARIADB_USER:-bolao26}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in stack environment variables}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in stack environment variables}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: 'true'
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - default
      - nginx_proxy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/up']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  queue:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: 'false'
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--max-time=3600']
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy

  scheduler:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: 'false'
    command: ['php', 'artisan', 'schedule:work']
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  mariadb_data:
  app_storage:
  app_cache:

networks:
  nginx_proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK:-nginx_proxy}
